<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Egypt Premier Destinations — iPad Presentation & Kiosk Deck</title>
  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Montserrat', 'Cairo', sans-serif; background: #050B14; color: #FFFFFF; }
    
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-cairo { font-family: 'Cairo', sans-serif; }

    /* Glassmorphism for iPad Overlay */
    .glass-box {
      background: rgba(10, 18, 30, 0.88);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(217, 140, 52, 0.45);
      box-shadow: 0 20px 50px rgba(0,0,0,0.75);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 50%, #FBBF24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-badge {
      background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      color: #0F172A;
      font-weight: 800;
    }

    /* Fullscreen Slide Transition */
    .slide-stage {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
  </style>
</head>
<body class="flex flex-col h-full relative">

  <!-- TOP BAR: 4 MAIN REGION TABS & LANGUAGE SELECTOR -->
  <header class="h-16 bg-slate-950/90 border-b border-amber-500/30 px-4 md:px-8 flex items-center justify-between z-30 shadow-2xl backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center font-black text-slate-950 text-lg shadow-md border border-amber-300">
        𓋹
      </div>
      <div>
        <h1 class="font-cinzel text-base md:text-lg font-black text-white leading-none">HENU <span class="gold-gradient-text">DESTINATIONS</span></h1>
        <p class="text-[10px] text-amber-400 font-semibold tracking-widest uppercase">iPad Presentation Deck</p>
      </div>
    </div>

    <!-- 4 MAIN REGION TABS (الجيزة / القاهرة / الإسكندرية / الفيوم) -->
    <div class="flex items-center bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800 gap-1 overflow-x-auto no-scrollbar">
      <button onclick="switchCategory('giza')" id="cat-tab-giza" class="cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-black transition flex items-center gap-1.5 bg-amber-500 text-slate-950 shadow-md">
        <span>🔺</span> <span id="label-giza">Giza (الجيزة)</span>
      </button>
      <button onclick="switchCategory('cairo')" id="cat-tab-cairo" class="cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <span>🕌</span> <span id="label-cairo">Cairo (القاهرة)</span>
      </button>
      <button onclick="switchCategory('alexandria')" id="cat-tab-alex" class="cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <span>🌊</span> <span id="label-alex">Alexandria (الإسكندرية)</span>
      </button>
      <button onclick="switchCategory('fayoum')" id="cat-tab-fayoum" class="cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <span>🌴</span> <span id="label-fayoum">Fayoum (الفيوم)</span>
      </button>
    </div>

    <!-- Multi-Language Selector -->
    <div class="flex items-center gap-3">
      <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-amber-500/60 text-amber-300 font-bold text-xs md:text-sm rounded-xl px-3 py-1.5 outline-none cursor-pointer">
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇪🇬 العربية</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>

      <span id="slide-indicator" class="text-xs font-bold text-slate-400 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800">
        1 / 4
      </span>
    </div>
  </header>

  <!-- SLIDE PRESENTATION MAIN VIEWPORT -->
  <main id="presentation-viewport" class="flex-1 relative overflow-hidden bg-slate-950">
    <div id="slide-stage" class="absolute inset-0 flex slide-stage">
      <!-- Slides Injected Dynamically by JS -->
    </div>
  </main>

  <!-- IPAD BOTTOM NAVIGATION CONTROLS -->
  <footer class="h-16 bg-slate-950/95 border-t border-slate-800 px-6 flex items-center justify-between z-30">
    <!-- Previous Slide Button -->
    <button onclick="prevSlide()" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-black text-xs md:text-sm px-5 py-2.5 rounded-2xl transition flex items-center gap-2 shadow-lg active:scale-95">
      <span>◀</span> <span id="btn-prev">Previous</span>
    </button>

    <!-- Slide Thumbnails / Dots -->
    <div id="slide-dots" class="flex items-center gap-2">
      <!-- Dots injected dynamically -->
    </div>

    <!-- Next Slide Button -->
    <button onclick="nextSlide()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs md:text-sm px-5 py-2.5 rounded-2xl transition flex items-center gap-2 shadow-lg active:scale-95">
      <span id="btn-next">Next Sight</span> <span>▶</span>
    </button>
  </footer>

    let currentCategory = 'giza';
    let currentSlideIndex = 0;
    let currentLang = 'en';

    function renderSlides() {
      const stage = document.getElementById('slide-stage');
      const dotsContainer = document.getElementById('slide-dots');
      stage.innerHTML = '';
      dotsContainer.innerHTML = '';

      const slides = allDestinations[currentCategory] || [];

      slides.forEach((dest, index) => {
        const title = dest.title[currentLang] || dest.title['en'];
        const sub = dest.sub[currentLang] || dest.sub['en'];
        const desc = dest.desc[currentLang] || dest.desc['en'];
        const highlights = dest.highlights[currentLang] || dest.highlights['en'];

        const slideHtml = `
          <div class="w-full h-full flex-shrink-0 relative flex items-center justify-center p-4 md:p-8" style="width: 100vw;">
            <div class="absolute inset-0 z-0">
              <img src="${dest.img}" alt="${title}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/85 to-slate-950/40"></div>
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-slate-950/60"></div>
            </div>

            <div class="relative z-10 w-full max-w-5xl glass-box p-6 md:p-10 rounded-3xl grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
              <div class="md:col-span-8 space-y-3.5">
                <div class="flex items-center gap-3">
                  <span class="gold-badge text-xs px-3.5 py-1 rounded-full uppercase tracking-wider">${currentCategory.toUpperCase()}</span>
                  <span class="bg-slate-900/90 text-amber-300 font-bold text-xs px-3.5 py-1 rounded-full border border-amber-500/40">⏱️ ${dest.duration}</span>
                </div>

                <h2 class="text-2xl md:text-4xl font-black text-white leading-tight">${title}</h2>
                <p class="text-amber-400 font-bold text-xs md:text-sm">${sub}</p>
                <p class="text-slate-200 text-xs md:text-sm font-light leading-relaxed">${desc}</p>

                <div class="pt-3 border-t border-slate-800 space-y-1.5">
                  ${highlights.map(h => `
                    <div class="flex items-center gap-2 text-xs text-slate-100">
                      <span class="text-amber-400 font-bold">✓</span>
                      <span>${h}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="md:col-span-4 flex flex-col items-center md:items-end justify-center text-center md:text-right border-t md:border-t-0 md:border-l border-slate-800 pt-4 md:pt-0 md:pl-6">
                <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block mb-1">Trip Price From</span>
                <span class="text-3xl md:text-4xl font-black text-emerald-400 mb-4">$${dest.priceUSD} <span class="text-xs text-slate-400 font-normal">/ person</span></span>

                <a href="https://wa.me/201222600296?text=${encodeURIComponent('Hello, I am interested in booking: ' + title)}" target="_blank" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-black text-xs md:text-sm py-3.5 px-5 rounded-2xl shadow-xl transition flex items-center justify-center gap-2 active:scale-95">
                  <span>💬</span> <span>Book With Concierge</span>
                </a>
              </div>
            </div>
          </div>
        `;
        stage.innerHTML += slideHtml;

        const dot = document.createElement('button');
        dot.className = `w-3 h-3 rounded-full transition-all ${index === currentSlideIndex ? 'bg-amber-400 w-8' : 'bg-slate-700 hover:bg-slate-500'}`;
        dot.onclick = () => goToSlide(index);
        dotsContainer.appendChild(dot);
      });

      updateSlidePosition();
    }

    function updateSlidePosition() {
      const stage = document.getElementById('slide-stage');
      stage.style.transform = `translateX(-${currentSlideIndex * 100}vw)`;

      const slides = allDestinations[currentCategory] || [];
      document.getElementById('slide-indicator').innerText = `${currentSlideIndex + 1} / ${slides.length}`;

      const dots = document.getElementById('slide-dots').children;
      Array.from(dots).forEach((d, i) => {
        d.className = `w-3 h-3 rounded-full transition-all ${i === currentSlideIndex ? 'bg-amber-400 w-8' : 'bg-slate-700 hover:bg-slate-500'}`;
      });
    }

    function nextSlide() {
      const slides = allDestinations[currentCategory] || [];
      if (currentSlideIndex < slides.length - 1) {
        currentSlideIndex++;
      } else {
        currentSlideIndex = 0;
      }
      updateSlidePosition();
    }

    function prevSlide() {
      const slides = allDestinations[currentCategory] || [];
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
      } else {
        currentSlideIndex = slides.length - 1;
      }
      updateSlidePosition();
    }

    function goToSlide(index) {
      currentSlideIndex = index;
      updateSlidePosition();
    }

    function switchCategory(cat) {
      currentCategory = cat;
      currentSlideIndex = 0;

      document.querySelectorAll('.cat-tab').forEach(t => {
        t.className = "cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-300 hover:text-white transition flex items-center gap-1.5";
      });

      if (cat === 'giza') document.getElementById('cat-tab-giza').className = "cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-black transition flex items-center gap-1.5 bg-amber-500 text-slate-950 shadow-md";
      if (cat === 'cairo') document.getElementById('cat-tab-cairo').className = "cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-black transition flex items-center gap-1.5 bg-amber-500 text-slate-950 shadow-md";
      if (cat === 'alexandria') document.getElementById('cat-tab-alex').className = "cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-black transition flex items-center gap-1.5 bg-amber-500 text-slate-950 shadow-md";
      if (cat === 'fayoum') document.getElementById('cat-tab-fayoum').className = "cat-tab px-4 py-2 rounded-xl text-xs md:text-sm font-black transition flex items-center gap-1.5 bg-amber-500 text-slate-950 shadow-md";

      renderSlides();
    }

    function changeLanguage(lang) {
      currentLang = lang;
      if (lang === 'ar') {
        document.documentElement.dir = 'rtl';
        document.getElementById('label-giza').innerText = '1- الجيزة';
        document.getElementById('label-cairo').innerText = '2- القاهرة';
        document.getElementById('label-alex').innerText = '3- الإسكندرية';
        document.getElementById('label-fayoum').innerText = '4- الفيوم وسفاري';
        document.getElementById('btn-prev').innerText = 'السابق';
        document.getElementById('btn-next').innerText = 'المزار التالي';
      } else {
        document.documentElement.dir = 'ltr';
        document.getElementById('label-giza').innerText = '1- Giza';
        document.getElementById('label-cairo').innerText = '2- Cairo';
        document.getElementById('label-alex').innerText = '3- Alexandria';
        document.getElementById('label-fayoum').innerText = '4- Fayoum Safari';
        document.getElementById('btn-prev').innerText = 'Previous';
        document.getElementById('btn-next').innerText = 'Next Sight';
      }
      renderSlides();
    }

    // Touch Swipe Gesture Handling for iPad
    let startX = 0;
    const viewport = document.getElementById('presentation-viewport');

    viewport.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].clientX;
      const diffX = startX - endX;

      if (Math.abs(diffX) > 50) {
        if (diffX > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    window.onload = function() {
      renderSlides();
    };
  </script>
