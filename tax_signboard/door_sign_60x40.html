<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>يافطة الباب — شركة المطعم الأرجنتيني المتطور لإدارة الفنادق والمطاعم (60x40 cm)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900;1000&display=swap" rel="stylesheet">
  <style>
    @page {
      size: 600mm 400mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      width: 600mm;
      height: 400mm;
      margin: 0;
      padding: 0;
      background: #0B1726;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Board Frame 60cm x 40cm */
    .signboard {
      width: 580mm;
      height: 380mm;
      background: linear-gradient(145deg, #07121E 0%, #0F2035 50%, #060F1A 100%);
      border: 7mm solid #C9873A;
      border-radius: 14mm;
      position: relative;
      padding: 20mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
      text-align: center;
    }

    /* Inner Gold Border Ring */
    .signboard::before {
      content: '';
      position: absolute;
      top: 5mm;
      left: 5mm;
      right: 5mm;
      bottom: 5mm;
      border: 2mm solid rgba(217, 140, 52, 0.45);
      border-radius: 9mm;
      pointer-events: none;
    }

    /* Corner Luxury Ornaments */
    .corner {
      position: absolute;
      width: 30mm;
      height: 30mm;
      border-color: #D98C34;
      border-style: solid;
      pointer-events: none;
    }
    .top-left { top: 9mm; left: 9mm; border-width: 3.5mm 0 0 3.5mm; }
    .top-right { top: 9mm; right: 9mm; border-width: 3.5mm 3.5mm 0 0; }
    .bottom-left { bottom: 9mm; left: 9mm; border-width: 0 0 3.5mm 3.5mm; }
    .bottom-right { bottom: 9mm; right: 9mm; border-width: 0 3.5mm 3.5mm 0; }

    /* Line 1: شركة */
    .line-1 {
      font-size: 52pt;
      font-weight: 800;
      color: #E2E8F0;
      letter-spacing: 2px;
      margin-bottom: 2mm;
    }

    /* Line 2: المطعم الأرجنتيني المتطور */
    .line-2 {
      font-size: 68pt;
      font-weight: 1000;
      color: #F59E0B;
      line-height: 1.25;
      text-shadow: 0 6px 20px rgba(0,0,0,0.8);
      margin-bottom: 4mm;
    }

    /* Line 3: لإدارة الفنادق والمطاعم */
    .line-3 {
      font-size: 56pt;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 1px;
    }

  </style>
</head>
<body>

  <div class="signboard">
    <!-- Corner Ornaments -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Centered 3 Lines Only -->
    <div class="line-1">شركة</div>
    <div class="line-2">المطعم الأرجنتيني المتطور</div>
    <div class="line-3">لإدارة الفنادق والمطاعم</div>
  </div>

</body>
</html>
